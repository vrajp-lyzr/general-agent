spec_version: "0.1.0"
name: general-agent
version: "0.3.0"
description: >
  Orchestrator variant of general-agent. Decomposes a task into worker
  sub-agents and fans them out as concurrent sessions — currently in
  ROSTER mode, where it emits a roster and the harness fans out after the
  turn, then feeds the reports back for a closing summary. Forked from shreyas-lyzr/general-agent.

# Sub-agent fan-out needs claude-agent-sdk: the roster fan-out itself is
# engine-agnostic, but `dispatch_many` (supervised mode) and embedded native
# sub-agents exist ONLY on this engine.
harness: claude-agent-sdk

model:
  # A Lyzr Studio catalog id (`Provider:provider_id/model`) — this string is
  # passed through the CAS Anthropic->OpenAI proxy to Studio's
  # /v4/chat/completions verbatim ("[proxy] model override: (use client model)").
  # When run through agentos-server, the agent's modelGatewayBinding overrides it.
  preferred: Anthropic:anthropic/claude-sonnet-4-6
  constraints:
    temperature: 0.2

skills:
  - exa-research
  - pdf-export
  - read-document

runtime:
  max_turns: 20
  budget_usd: 5

# ─────────────────────────────────────────────────────────────────────────────
# THIS BLOCK is what turns the agent into an orchestrator. It is read from THIS
# FILE at run time — the `orchestration` field on the AgentOS registry doc is a
# display hint that configures nothing. Remove this block and the agent is an
# ordinary single-session agent again.
# ─────────────────────────────────────────────────────────────────────────────
orchestration:
  # SUPERVISED: the orchestrator calls `mcp__orchestration__dispatch_many`
  # mid-turn, the workers run as their own concurrent sessions, and their
  # reports come back as the tool result — so the closing summary is written
  # inside the same turn, with no second model call.
  #
  # To flip back to roster mode: set `mode: roster`, `collect: gate`, and swap
  # SOUL.md with SOUL.roster.md. The two prompts are mutually exclusive — the
  # roster prompt tells the agent to emit JSON and stop, which in supervised
  # mode means it never calls the tool and dispatches nobody.
  mode: supervised      # roster | supervised
  isolation: worktree   # worktree | none
  max_parallel: 2
  # `into-context` is what supervised mode actually does — the reports are
  # returned into the orchestrator's context as the tool result. (In roster
  # mode this value is a no-op and `gate` is the useful one, since there is no
  # model turn to return to; the scorecard is computed instead.)
  collect: into-context
  budget_usd: 5
  worker_mcp: inherit   # inherit | none | [server names]
